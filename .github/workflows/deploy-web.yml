name: Deploy web demo

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx expo export -p web --output-dir dist
      # SPA fallback: GitHub Pages has no server rewrites, so deep links
      # (/NoteGym/perfil) need index.html served on 404.
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
