plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.restchronometer'
version = '0.1.0'

android {
  namespace "expo.modules.restchronometer"
  // O expo-module-gradle-plugin monta a publicação do módulo a partir daqui e
  // falha na configuração do Gradle sem os dois — antes de compilar uma linha
  // de Kotlin.
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}
